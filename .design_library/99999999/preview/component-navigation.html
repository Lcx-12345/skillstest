<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-body);color:var(--color-foreground)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.label{width:92px;flex-shrink:0;font-size:var(--font-size-caption);letter-spacing:.08em;text-transform:uppercase;color:var(--color-muted-foreground)}
.divider{border:none;border-top:1px solid var(--color-border);margin:12px 0}
/* @component-css-start */
.nav-announcement{width:100%;height:36px;display:flex;align-items:center;justify-content:center;background:var(--color-muted);font-size:var(--font-size-caption);letter-spacing:.12em;color:var(--color-foreground)}
.nav-header{width:100%;height:64px;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--space-8);background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.nav-menu{display:flex;gap:var(--space-5);justify-self:start}
.nav-actions{display:flex;gap:var(--space-5);justify-self:end}
.nav-link{font-size:var(--font-size-caption);letter-spacing:.12em;color:var(--color-foreground);text-decoration:none;white-space:nowrap}
.nav-header a:hover{text-decoration:underline;text-underline-offset:6px}
.nav-wordmark{font-family:var(--font-display);font-size:var(--font-size-h4);font-weight:var(--font-weight-display);letter-spacing:.08em;color:var(--color-foreground);text-decoration:none;white-space:nowrap}
.nav-hero{width:100%;background:var(--lux-warm-900)}
.nav-hero .nav-header{background:transparent;border-bottom:none}
.nav-hero .nav-link,.nav-hero .nav-wordmark{color:var(--lux-warm-50)}
.nav-hero-body{height:120px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:var(--font-size-h3);font-weight:var(--font-weight-display);letter-spacing:.14em;color:var(--lux-warm-50)}
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">标准页头</span></div>
<div class="row"><div class="nav-announcement" data-evidence-sample="announcement">限时臻选 · 会员优先购</div></div>
<div class="row"><header class="nav-header" data-evidence-sample="header-standard"><nav class="nav-menu"><a href="#" class="nav-link">经典系列</a><a href="#" class="nav-link">新品登场</a><a href="#" class="nav-link">臻品推荐</a></nav><a href="#" class="nav-wordmark">99999999</a><nav class="nav-actions"><a href="#" class="nav-link">搜索</a><a href="#" class="nav-link">购物袋</a><a href="#" class="nav-link">会员礼遇</a></nav></header></div>
<hr class="divider">
<div class="row"><span class="label">透明页头</span></div>
<div class="row"><div class="nav-hero" data-evidence-sample="header-transparent"><header class="nav-header"><nav class="nav-menu"><a href="#" class="nav-link">经典系列</a><a href="#" class="nav-link">臻品推荐</a></nav><a href="#" class="nav-wordmark">99999999</a><nav class="nav-actions"><a href="#" class="nav-link">购物袋</a></nav></header><div class="nav-hero-body">新品登场</div></div></div>
</body>
</html>
