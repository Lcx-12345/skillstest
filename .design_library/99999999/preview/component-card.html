<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body{margin:0;padding:12px;background:var(--color-background);font-family:var(--font-body);color:var(--color-foreground);}
.row{display:flex;gap:var(--space-3);align-items:flex-start;margin-bottom:var(--space-3);}
.label{width:92px;flex-shrink:0;font-size:var(--font-size-caption);letter-spacing:.08em;color:var(--color-muted-foreground);padding-top:var(--space-2);}
.divider{border:0;border-top:1px solid var(--color-border);margin:var(--space-2) 0 var(--space-3);}
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-6);flex:1;min-width:0;transition:filter .15s;}
.card:hover{filter:brightness(.97);}
.card .media{height:160px;background:var(--color-muted);border-radius:var(--radius-sm);margin-bottom:var(--space-5);}
.card .eyebrow{font-size:var(--font-size-eyebrow);font-weight:var(--font-weight-eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-2);}
.card .headline{font-family:var(--font-heading);font-size:var(--font-size-h3);font-weight:var(--font-weight-h3);line-height:var(--line-height-h3);color:var(--color-foreground);margin:0 0 var(--space-2);word-break:keep-all;overflow-wrap:break-word;}
.card .body{font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--color-muted-foreground);margin:0 0 var(--space-4);overflow-wrap:break-word;}
.card .action{display:inline-block;font-size:var(--font-size-body);color:var(--link);text-decoration:underline;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);transition:background .15s,color .15s;white-space:nowrap;}
.card .action:hover{background:var(--accent-hover);color:var(--accent-foreground);}
.card-accent{border:0;border-top:2px solid var(--color-primary);}
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">编辑特写</span><div class="card" data-evidence-sample="editorial-image"><div class="media" role="img" aria-label="臻选会员计划视觉图"></div><div class="eyebrow">会员礼遇</div><h3 class="headline">臻选会员计划</h3><p class="body">每季新品优先预览与专属礼遇</p><a class="action" href="#">查看详情</a></div></div>
<hr class="divider">
<div class="row"><span class="label">静谧面板</span><div class="card" data-evidence-sample="quiet-text"><h3 class="headline">经典系列</h3><p class="body">以年代传承的手工艺</p><a class="action" href="#">查看详情</a></div></div>
<div class="row"><span class="label">促销横幅</span><div class="card card-accent" data-evidence-sample="accent-rule"><div class="eyebrow">限时臻选</div><h3 class="headline">秋季首发</h3><p class="body">会员优先购</p></div></div>
</body>
</html>
