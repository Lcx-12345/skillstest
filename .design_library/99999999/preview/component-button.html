<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Button</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-8); border: none; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: var(--type-body-md); font-weight: var(--font-weight-body); letter-spacing: .12em; white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s, filter .15s; }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:not(:disabled):hover { filter: brightness(.92); }
.btn-outline { background: transparent; color: var(--color-foreground); border: 1px solid var(--color-border); }
.btn-outline:not(:disabled):hover { background: var(--color-muted); }
.btn:disabled { background: var(--color-muted); color: var(--color-muted-foreground); cursor: not-allowed; }
.btn-sm { height: var(--size-button-sm); min-width: var(--size-button-sm); }
.btn-lg { height: var(--size-button-lg); min-width: var(--size-button-lg); }
.btn-link { display: inline-flex; align-items: center; padding: 0; border: none; background: transparent; font-family: var(--font-body); font-size: var(--font-size-caption); color: var(--color-foreground); text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; cursor: pointer; transition: background .15s; }
.btn-link:hover { background: var(--color-muted); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要操作</span><button class="btn btn-primary" data-evidence-sample="primary-md">加入购物袋</button></div>
<div class="row"><span class="label">次要操作</span><button class="btn btn-outline" data-evidence-sample="outline-md">查看详情</button></div>
<div class="row"><span class="label">文字链接</span><button class="btn-link" data-evidence-sample="link-sm">会员礼遇</button></div>
<hr class="divider">
<div class="row"><span class="label">尺寸对比</span><button class="btn btn-primary btn-sm">结算</button><button class="btn btn-primary">结算</button><button class="btn btn-primary btn-lg">结算</button></div>
<div class="row"><span class="label">禁用状态</span><button class="btn btn-primary" disabled data-evidence-sample="primary-md-disabled">已售罄</button></div>
</body>
</html>
