<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-body); font-size:var(--type-body-md); color:var(--color-foreground); }
.row { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-2); flex-wrap:wrap; }
.label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); letter-spacing:.05em; text-transform:uppercase; color:var(--color-muted-foreground); }
.divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-2) 0; }
.field { width:300px; flex-shrink:0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.f-label { display:block; font-size:var(--font-size-caption); font-weight:var(--font-weight-caption); color:var(--color-muted-foreground); margin-bottom:var(--space-1); }
.f-line { display:flex; align-items:center; gap:var(--space-2); }
.inp { font:inherit; color:var(--color-foreground); background:transparent; border:none; border-bottom:1px solid var(--color-border); padding:var(--space-3) 0; width:100%; min-width:0; transition:border-color .15s; }
.inp::placeholder { color:var(--color-muted-foreground); }
.inp:hover { border-bottom-color:var(--color-muted-foreground); }
.inp:focus { outline:none; border-bottom-color:var(--accent); }
.inp.err, .inp.err:hover, .inp.err:focus { border-bottom-color:var(--color-error); }
.f-help { display:block; font-size:var(--font-size-caption); color:var(--color-error); margin-top:var(--space-1); }
.f-link { flex-shrink:0; color:var(--link); text-decoration:none; white-space:nowrap; transition:color .15s; }
.f-link:hover { color:var(--accent-hover); }
.inp-box { font:inherit; color:var(--color-foreground); width:100%; height:var(--size-input-height); background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:0 var(--space-4); transition:border-color .15s; }
.inp-box::placeholder { color:var(--color-muted-foreground); }
.inp-box:hover { border-color:var(--color-muted-foreground); }
.inp-box:focus { outline:none; border-color:var(--accent); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">下划线</span>
  <div class="field" data-evidence-sample="underline-default">
    <span class="f-label">电子邮件地址</span>
    <span class="f-line"><input class="inp" type="email" placeholder="name@example.com" aria-label="电子邮件地址"><a class="f-link" href="#">订阅</a></span>
  </div>
</div>
<hr class="divider">
<div class="row"><span class="label">盒式</span>
  <div class="field" data-evidence-sample="boxed-default">
    <input class="inp-box" type="text" placeholder="搜索臻品" aria-label="搜索臻品">
  </div>
</div>
<div class="row"><span class="label">错误</span>
  <div class="field" data-evidence-sample="underline-error">
    <span class="f-label">电子邮件地址</span>
    <input class="inp err" type="email" placeholder="name@example.com" aria-label="电子邮件地址" aria-invalid="true">
    <span class="f-help">请输入有效的邮箱地址</span>
  </div>
</div>
</body>
</html>
