<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外圈旋转弧线 -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#g2)" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="210 117"/>

  <!-- 主体圆盘 -->
  <circle cx="60" cy="60" r="42" fill="url(#g1)"/>

  <!-- 高光 -->
  <ellipse cx="46" cy="42" rx="18" ry="10" fill="#ffffff" opacity="0.18"
           transform="rotate(-25 46 42)"/>

  <!-- 中心字母 T -->
  <text x="60" y="76" font-family="Arial, sans-serif" font-size="44" font-weight="bold"
        fill="#ffffff" text-anchor="middle" filter="url(#glow)">T</text>

  <!-- 点缀星点 -->
  <circle cx="99" cy="30" r="4" fill="#22d3ee"/>
  <circle cx="22" cy="88" r="3" fill="#6366f1"/>
</svg>
