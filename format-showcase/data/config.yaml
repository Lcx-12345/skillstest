# AI 研发效能评估 · 分析配置
report:
  title: 2026 Q4 AI 研发效能评估报告
  owner: 效能度量小组
  period: 2026-05 ~ 2026-10

dataset:
  source: ./metrics.json
  task_types_key: task_types
  trend_key: monthly_trend
  currency: CNY

thresholds:
  automation_rate_warn: 65.0
  automation_rate_good: 80.0
  first_pass_rate_warn: 65.0
  first_pass_rate_good: 85.0
  avg_minutes_warn: 30.0

outputs:
  - format: docx
    path: ../docs/AI研发效能评估报告.docx
  - format: pdf
    path: ../docs/AI研发效能评估报告.pdf
  - format: xlsx
    path: ./AI研发效能评估.xlsx
  - format: pptx
    path: ../slides/AI研发效能评估.pptx
  - format: html
    path: ../web/index.html

segments:
  - name: 高自动化区
    rule: automation_rate >= 85
  - name: 重点改进区
    rule: automation_rate < 65
