<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风景图片画廊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }
        .card .info {
            padding: 12px 16px;
        }
        .card .info h3 {
            font-size: 15px;
            color: #fff;
            margin-bottom: 4px;
        }
        .card .info p {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🏔️ 风景/自然图片画廊</h1>
    <div class="gallery">
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Golden%20sunrise%20over%20misty%20mountain%20valleys%2C%20dramatic%20light%2C%20aerial%20view%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Mountain Sunrise">
            <div class="info"><h3>1. 金色日出 · 云雾山谷</h3><p>晨曦中的群山与云海</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Tropical%20beach%20with%20turquoise%20water%2C%20palm%20trees%2C%20white%20sand%2C%20clear%20blue%20sky%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Tropical Beach">
            <div class="info"><h3>2. 热带海滩 · 椰林白沙</h3><p>碧蓝海水与白色沙滩</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Autumn%20forest%20with%20golden%20and%20red%20leaves%2C%20sunlight%20through%20trees%2C%20dirt%20path%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Autumn Forest">
            <div class="info"><h3>3. 秋日森林 · 金红落叶</h3><p>阳光穿透秋叶的林间小径</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Snow-capped%20mountain%20peaks%20under%20clear%20blue%20sky%2C%20alpine%20lake%20reflection%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Snow Mountains">
            <div class="info"><h3>4. 雪山之巅 · 蓝天倒影</h3><p>雪山与高山湖泊的倒影</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Cascading%20waterfall%20in%20lush%20green%20rainforest%2C%20mist%2C%20sunlight%20rays%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Waterfall">
            <div class="info"><h3>5. 瀑布飞流 · 雨林秘境</h3><p>热带雨林中的层叠瀑布</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Desert%20sand%20dunes%20at%20sunset%2C%20warm%20orange%20and%20golden%20colors%2C%20ripples%20in%20sand%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Desert Sunset">
            <div class="info"><h3>6. 沙漠日落 · 金色沙丘</h3><p>夕阳下的沙漠沙丘</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Lavender%20fields%20stretching%20to%20horizon%20at%20twilight%2C%20purple%20and%20pink%20sky%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Lavender Fields">
            <div class="info"><h3>7. 薰衣草田 · 暮色花海</h3><p>暮色中的薰衣草田野</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Northern%20lights%20aurora%20borealis%20reflected%20in%20calm%20lake%2C%20starry%20sky%2C%20green%20and%20purple%20lights%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Northern Lights">
            <div class="info"><h3>8. 北极极光 · 星空湖映</h3><p>极光倒映在平静湖面上</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Cherry%20blossom%20trees%20in%20full%20bloom%20along%20riverside%20path%2C%20pink%20petals%20falling%2C%20spring%20morning%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Cherry Blossom">
            <div class="info"><h3>9. 樱花盛开 · 春日河畔</h3><p>河畔樱花盛开，花瓣飘落</p></div>
        </div>
        <div class="card">
            <img src="https://remote-pod.enterprise.trae.cn/api/ide/v1/text_to_image?prompt=Dramatic%20coastal%20cliffs%20with%20crashing%20ocean%20waves%2C%20sea%20spray%2C%20overcast%20sky%2C%20photorealistic%2C%20high%20detail&image_size=landscape_16_9" alt="Coastal Cliffs">
            <div class="info"><h3>10. 海岸悬崖 · 惊涛拍岸</h3><p>海浪拍打壮丽的海岸悬崖</p></div>
        </div>
    </div>
</body>
</html>
