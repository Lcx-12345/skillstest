<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹贪吃蛇 | Neon Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="scanlines"></div>

        <div id="menu-screen" class="screen active">
            <div class="menu-content">
                <h1 class="game-title">
                    <span class="title-line">NEON</span>
                    <span class="title-line title-pink">SNAKE</span>
                </h1>
                <p class="subtitle">复古赛博朋克贪吃蛇</p>
                
                <button id="start-btn" class="pixel-btn btn-primary">
                    开始游戏
                </button>

                <div class="rules-card">
                    <h3 class="rules-title">游戏规则</h3>
                    <ul class="rules-list">
                        <li><span class="key">↑↓←→</span> 或 <span class="key">WASD</span> 控制方向</li>
                        <li><span class="key">空格</span> 暂停 / 继续</li>
                        <li>吃 <span class="food-dot"></span> 食物得分，每吃5个升一级</li>
                        <li>撞墙或撞到自己游戏结束</li>
                    </ul>
                </div>

                <div class="high-score-display">
                    最高分: <span id="menu-high-score">0</span>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="stat-box">
                    <span class="stat-label">分数</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">等级</span>
                    <span id="level" class="stat-value">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">最高</span>
                    <span id="high-score" class="stat-value">0</span>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="game-canvas" width="400" height="400"></canvas>
                <div id="pause-overlay" class="overlay hidden">
                    <div class="overlay-content">
                        <h2 class="overlay-title">已暂停</h2>
                        <p class="overlay-subtitle">按空格继续</p>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button id="pause-btn" class="pixel-btn btn-secondary">暂停</button>
                <button id="restart-btn" class="pixel-btn btn-secondary">重新开始</button>
                <button id="menu-btn" class="pixel-btn btn-secondary">返回菜单</button>
            </div>
        </div>

        <div id="gameover-screen" class="screen">
            <div class="gameover-content">
                <h2 class="gameover-title">游戏结束</h2>
                
                <div class="final-stats">
                    <div class="final-stat">
                        <span class="final-label">最终得分</span>
                        <span id="final-score" class="final-score-value">0</span>
                    </div>
                    <div class="final-stat">
                        <span class="final-label">最终等级</span>
                        <span id="final-level" class="final-value">1</span>
                    </div>
                    <div class="final-stat">
                        <span class="final-label">最高分</span>
                        <span id="final-high-score" class="final-value">0</span>
                    </div>
                </div>

                <div id="new-record" class="new-record hidden">
                    ★ 新纪录！★
                </div>

                <div class="gameover-buttons">
                    <button id="retry-btn" class="pixel-btn btn-primary">再来一局</button>
                    <button id="back-menu-btn" class="pixel-btn btn-secondary">返回菜单</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
