<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL TETRIS</title>
<style>
  /* 复古像素风：使用像素字体 + 黑底亮色方块 */
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #00ff66;
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* 像素化扫描线背景，增强街机感 */
    background-image:
      repeating-linear-gradient(0deg, rgba(0, 255, 102, 0.03) 0px, rgba(0, 255, 102, 0.03) 1px, transparent 1px, transparent 3px);
    image-rendering: pixelated;
    padding: 16px;
  }

  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    margin-bottom: 16px;
    text-shadow: 0 0 8px #00ff66, 0 0 16px #00ff66;
    animation: flicker 3s infinite alternate;
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93%, 96% { opacity: 0.6; }
  }

  .panel {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 10px;
    line-height: 1.8;
  }

  .box {
    border: 2px solid #00ff66;
    padding: 10px 12px;
    background: #111;
    box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
  }

  .box .label { color: #888; font-size: 8px; }
  .box .value { color: #ffe600; font-size: 14px; margin-top: 6px; text-shadow: 0 0 6px #ffe600; }

  #game {
    border: 3px solid #00ff66;
    box-shadow: 0 0 14px rgba(0, 255, 102, 0.6);
    background: #000;
    image-rendering: pixelated;
  }

  .hint { font-size: 8px; color: #888; line-height: 1.8; }
  .hint span { color: #00ff66; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 10;
  }
  .overlay h2 { color: #ff3b3b; font-size: 24px; text-shadow: 0 0 10px #ff3b3b; }
  .overlay button {
    font-family: inherit;
    font-size: 10px;
    padding: 12px 20px;
    background: #00ff66;
    color: #000;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 10px #00ff66;
  }
  .overlay button:hover { background: #00cc50; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>PIXEL TETRIS</h1>
  <div class="panel">
    <div class="side">
      <div class="box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <div class="label">LINES</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="hint">
        <span>&lt;- -&gt;</span> MOVE<br>
        <span>^</span> ROTATE<br>
        <span>v</span> SOFT DROP<br>
        <span>SPACE</span> HARD DROP<br>
        <span>P</span> PAUSE
      </div>
    </div>
    <canvas id="game" width="300" height="600"></canvas>
  </div>

  <div class="overlay hidden" id="overlay">
    <h2 id="overlayTitle">GAME OVER</h2>
    <button id="restartBtn">RESTART</button>
  </div>

<script>
(() => {
  'use strict';

  // ---------- 配置 ----------
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;          // 每格像素
  const DROP_INTERVAL = 800; // 基础下落间隔(ms)

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 7 种标准俄罗斯方块，复古鲜艳配色
  const PIECES = {
    I: { color: '#00f0f0', shape: [[1,1,1,1]] },
    O: { color: '#f0f000', shape: [[1,1],[1,1]] },
    T: { color: '#a000f0', shape: [[0,1,0],[1,1,1]] },
    S: { color: '#00f000', shape: [[0,1,1],[1,1,0]] },
    Z: { color: '#f00000', shape: [[1,1,0],[0,1,1]] },
    J: { color: '#0000f0', shape: [[1,0,0],[1,1,1]] },
    L: { color: '#f0a000', shape: [[0,0,1],[1,1,1]] },
  };
  const TYPES = Object.keys(PIECES);

  // ---------- 状态 ----------
  let grid, cur, pos, score, lines, dropTimer, lastTime, paused, gameOver;

  function makeGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  }

  function newPiece() {
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    const p = PIECES[type];
    return {
      type,
      color: p.color,
      shape: p.shape.map(row => row.slice()),
    };
  }

  function reset() {
    grid = makeGrid();
    score = 0;
    lines = 0;
    paused = false;
    gameOver = false;
    dropTimer = 0;
    lastTime = 0;
    cur = newPiece();
    pos = { x: Math.floor(COLS / 2) - Math.floor(cur.shape[0].length / 2), y: 0 };
    updateHUD();
    hideOverlay();
  }

  // ---------- 碰撞检测 ----------
  function collide(shape, x, y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && grid[ny][nx]) return true;
      }
    }
    return false;
  }

  // ---------- 旋转：顺时针 90 度 ----------
  function rotate(shape) {
    const rows = shape.length, cols = shape[0].length;
    const out = Array.from({ length: cols }, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        out[c][rows - 1 - r] = shape[r][c];
      }
    }
    return out;
  }

  // ---------- 锁定方块到网格 ----------
  function lock() {
    for (let r = 0; r < cur.shape.length; r++) {
      for (let c = 0; c < cur.shape[r].length; c++) {
        if (cur.shape[r][c]) {
          const y = pos.y + r, x = pos.x + c;
          if (y < 0) { endGame(); return; }
          grid[y][x] = cur.color;
        }
      }
    }
    clearLines();
    cur = newPiece();
    pos = { x: Math.floor(COLS / 2) - Math.floor(cur.shape[0].length / 2), y: 0 };
    if (collide(cur.shape, pos.x, pos.y)) endGame();
  }

  // ---------- 消行 ----------
  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(cell => cell)) {
        grid.splice(r, 1);
        grid.unshift(Array(COLS).fill(0));
        cleared++;
        r++; // 同一行重新检测
      }
    }
    if (cleared > 0) {
      // 经典计分：1=100 2=300 3=500 4=800
      const pts = [0, 100, 300, 500, 800][cleared];
      score += pts;
      lines += cleared;
      updateHUD();
    }
  }

  // ---------- 操作 ----------
  function move(dx) {
    if (paused || gameOver) return;
    if (!collide(cur.shape, pos.x + dx, pos.y)) pos.x += dx;
  }

  function softDrop() {
    if (paused || gameOver) return;
    if (!collide(cur.shape, pos.x, pos.y + 1)) {
      pos.y++;
      score += 1;
      updateHUD();
    } else {
      lock();
    }
    dropTimer = 0;
  }

  function hardDrop() {
    if (paused || gameOver) return;
    let dist = 0;
    while (!collide(cur.shape, pos.x, pos.y + 1)) {
      pos.y++;
      dist++;
    }
    score += dist * 2;
    updateHUD();
    lock();
  }

  function tryRotate() {
    if (paused || gameOver) return;
    const rotated = rotate(cur.shape);
    // 简易踢墙：尝试原位 / 左右各偏移 1 格
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collide(rotated, pos.x + k, pos.y)) {
        cur.shape = rotated;
        pos.x += k;
        return;
      }
    }
  }

  // ---------- 游戏结束 ----------
  function endGame() {
    gameOver = true;
    showOverlay('GAME OVER');
  }

  // ---------- HUD ----------
  function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
  }

  function showOverlay(title) {
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlay').classList.remove('hidden');
  }
  function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
  }

  // ---------- 绘制 ----------
  function drawCell(x, y, color) {
    const px = x * CELL, py = y * CELL;
    // 主体
    ctx.fillStyle = color;
    ctx.fillRect(px, py, CELL, CELL);
    // 像素风高光（左上）与暗边（右下）
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(px, py, CELL, 4);
    ctx.fillRect(px, py, 4, CELL);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px, py + CELL - 4, CELL, 4);
    ctx.fillRect(px + CELL - 4, py, 4, CELL);
  }

  function drawGrid() {
    // 背景网格线
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }
  }

  function draw() {
    drawGrid();
    // 已锁定方块
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) drawCell(c, r, grid[r][c]);
      }
    }
    // 当前方块
    for (let r = 0; r < cur.shape.length; r++) {
      for (let c = 0; c < cur.shape[r].length; c++) {
        if (cur.shape[r][c]) drawCell(pos.x + c, pos.y + r, cur.color);
      }
    }
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = '20px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
  }

  // ---------- 主循环 ----------
  function loop(time = 0) {
    const delta = time - lastTime;
    lastTime = time;
    if (!paused && !gameOver) {
      dropTimer += delta;
      if (dropTimer > DROP_INTERVAL) {
        dropTimer = 0;
        if (!collide(cur.shape, pos.x, pos.y + 1)) {
          pos.y++;
        } else {
          lock();
        }
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  document.addEventListener('keydown', (e) => {
    if (gameOver) return;
    switch (e.key) {
      case 'ArrowLeft':  move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown':  softDrop(); break;
      case 'ArrowUp':    tryRotate(); break;
      case ' ':          e.preventDefault(); hardDrop(); break;
      case 'p':
      case 'P':          paused = !paused; break;
    }
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    reset();
    requestAnimationFrame(loop);
  });

  // ---------- 启动 ----------
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
